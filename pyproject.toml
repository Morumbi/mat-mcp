[project]
name = "mat-mcp"
version = "0.1.0"
description = "Streamable HTTP MCP server wrapper for Eclipse Memory Analyzer Tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.16,<2",
    "fastmcp>=2.12,<4",
    "pydantic>=2.11,<3",
    "PyYAML>=6.0.2,<7",
    "SQLAlchemy>=2.0.41,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<3",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
mat-mcp = "mat_mcp.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mat_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/mat_mcp/py.typed" = "mat_mcp/py.typed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=mat_mcp --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["mat_mcp"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
mypy_path = ["src"]
